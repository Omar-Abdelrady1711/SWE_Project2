name: CD - Deploy to AWS (Lambda + API Gateway)

on:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: acme-registry-deployments-052747538576-us-east-1
  STACK_NAME: acme-registry-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::052747538576:role/GitHubOIDCDeployRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS SAM CLI
        run: pip install aws-sam-cli

      - name: Build (SAM)
        run: sam build --use-container

      - name: Deploy (SAM)
        run: |
          sam deploy \
            --stack-name $STACK_NAME \
            --s3-bucket $S3_BUCKET \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --region $AWS_REGION

      - name: Fetch API URL and smoke test
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name $STACK_NAME \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "Deployed API URL: $URL"
          curl -fsS "$URL/health"
