name: CD - Deploy to AWS (Lambda + API Gateway)

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: acme-registry-deployments-052747538576-us-east-1
  STACK_NAME: acme-registry-staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::052747538576:role/GitHubOIDCDeployRole
          aws-region: ${{ env.AWS_REGION }}

      # Only install SAM CLI; use the runner's built-in AWS CLI v2
      - name: Install AWS SAM CLI
        run: |
          pip install aws-sam-cli

      # Faster build: no --use-container unless you really need it
      - name: Build (SAM)
        run: sam build

      - name: Deploy (SAM)
        run: |
          sam deploy \
            --stack-name ${{ env.STACK_NAME }} \
            --s3-bucket ${{ env.S3_BUCKET }} \
            --capabilities CAPABILITY_IAM \
            --no-fail-on-empty-changeset \
            --region ${{ env.AWS_REGION }}

      - name: Fetch API URL and smoke test
        run: |
          URL=$(aws cloudformation describe-stacks \
            --stack-name ${{ env.STACK_NAME }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "Deployed API URL: $URL"
          curl -fsS "$URL/api/health"

      - name: Tail Lambda logs on failure
        if: failure()
        run: |
          echo "Deployment failed – trying to show recent Lambda logs"
          set +e
          FUNC=$(aws cloudformation list-stack-resources \
            --stack-name ${{ env.STACK_NAME }} \
            --query "StackResourceSummaries[?ResourceType=='AWS::Lambda::Function'].PhysicalResourceId" \
            --output text 2>/dev/null || true)
          echo "Function: $FUNC"
          if [ -n "$FUNC" ]; then
            aws logs describe-log-groups \
              --log-group-name-prefix "/aws/lambda/$FUNC" \
              --output text || true

            # last ~15 minutes of REPORT lines
            START_TIME=$(($(date -u +%s -d "15 minutes ago") * 1000))
            aws logs filter-log-events \
              --log-group-name "/aws/lambda/$FUNC" \
              --start-time "$START_TIME" \
              --filter-pattern "REPORT" \
              --limit 50 \
              --output text || true
          fi
