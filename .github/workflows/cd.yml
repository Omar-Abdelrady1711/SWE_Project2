name: CD - Deploy to AWS Lambda

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install awscli

      - name: Package lambda
        env:
          S3_BUCKET: ${{ secrets.DEPLOY_S3_BUCKET }}
          LAMBDA_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          ZIP_NAME=lambda_package_${{ github.sha }}.zip
          # create a minimal package: copy code and requirements
          mkdir -p package
          cp -r . package/
          pushd package
          # remove git and workflow artifacts to keep package small
          rm -rf .git .github || true
          zip -r ../${ZIP_NAME} .
          popd
          aws s3 cp ${ZIP_NAME} s3://${S3_BUCKET}/${ZIP_NAME}

      - name: Deploy to Lambda
        env:
          S3_BUCKET: ${{ secrets.DEPLOY_S3_BUCKET }}
          LAMBDA_NAME: ${{ secrets.LAMBDA_FUNCTION_NAME }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          ZIP_NAME=lambda_package_${{ github.sha }}.zip
          aws lambda update-function-code --function-name ${LAMBDA_NAME} --s3-bucket ${S3_BUCKET} --s3-key ${ZIP_NAME} --region ${AWS_REGION}
